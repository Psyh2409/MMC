<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="wall-form" class="card-primary mb-md">
    <form th:action="@{/therapist/public-wall/create}" method="post" enctype="multipart/form-data" class="stack-form">
        <div class="form-field">
            <textarea name="content" class="form-textarea" rows="4" placeholder="Що б ви хотіли опублікувати? Вставте сюди текст або посилання на YouTube..." required></textarea>
        </div>

        <div class="media-preview-area mt-sm">
            <img id="wall-preview-img" class="media-preview is-hidden" alt="Прев'ю">
            <video id="wall-preview-vid" class="media-preview is-hidden" controls></video>
        </div>

        <div class="button-row mt-sm">
            <div class="left-actions">
                <label class="btn-outline">
                    📎 Додати фото/відео
                    <input type="file" name="mediaFile" class="visually-hidden-input" accept="image/*,video/*" onchange="handlePublicWallMediaPreview(this)">
                </label>
                <span id="wall-file-name" class="file-name-display text-sm text-muted ml-sm"></span>
            </div>
            <div class="right-actions form-actions">
                <button type="submit" class="btn-primary">Опублікувати</button>
            </div>
        </div>
    </form>
</div>

<div th:fragment="wall-feed(posts, isOwner)" class="layout-stack mt-md">

    <div th:if="${posts == null or posts.isEmpty()}" class="profile-empty-state text-center mt-lg">
        <div class="icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        </div>
        <p class="text-muted">Стіна наразі порожня.</p>
    </div>

    <div th:each="post : ${posts}" class="journal-post-card card-secondary mb-sm relative">

        <div th:if="${isOwner}" class="post-actions absolute top-0 right-0 p-sm action-group">

            <button type="button" class="btn-icon" title="Редагувати" th:data-id="${post.id}" onclick="togglePublicPostEdit(this.getAttribute('data-id'))">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>

            <form th:action="@{/therapist/public-wall/delete/{id}(id=${post.id})}" method="post" class="form-inline-reset">
                <button type="submit" class="btn-icon delete-icon" title="Видалити допис" onclick="return confirm('Видалити цей допис?');">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </form>
        </div>

        <div class="post-header text-sm text-muted mb-xs">
            <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
        </div>

        <div th:id="'post-read-' + ${post.id}">
            <div class="journal-post-content text-body mb-sm parse-media-links" th:text="${post.content}">
                Текст поста
            </div>

            <div th:if="${post.mediaFileName != null}" class="journal-post-media-box mt-sm">
                <div th:if="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}" class="media-wrapper">
                    <video controls preload="metadata" class="journal-post-video w-100">
                        <source th:src="@{/api/media/{name}(name=${post.mediaFileName})}" type="video/mp4">
                    </video>
                </div>
                <div th:unless="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}" class="media-wrapper">
                    <img th:src="@{/api/media/{name}(name=${post.mediaFileName})}" alt="Media" class="journal-post-img w-100">
                </div>
            </div>
        </div>
        <!-- Секція коментарів під постом стіни -->
        <div class="post-comments-section mt-md pt-sm border-top">
            <!-- Форма нового коментаря -->
            <form th:if="${#authorization.expression('isAuthenticated()')}"
                  th:action="@{/public-posts/{postId}/comments(postId=${post.id})}"
                  method="post" class="stack-form mb-sm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <textarea name="content" class="form-textarea" rows="2" placeholder="Залишити коментар..." required></textarea>
                <div class="text-right mt-xs">
                    <button type="submit" class="btn-primary btn-sm">Залишити коментар</button>
                </div>
            </form>

            <!-- Дерево коментарів -->
            <div th:if="${postCommentsMap != null and postCommentsMap.get(post.id) != null}" class="comments-tree-wrapper">
                <div th:each="comment : ${postCommentsMap.get(post.id)}">
                    <div th:replace="~{fragments/comment-tree :: commentNode(${comment}, 0)}"></div>
                </div>
            </div>
        </div>
        <div th:if="${isOwner}" th:id="'post-edit-' + ${post.id}" class="is-hidden mt-sm">
            <form th:action="@{/therapist/public-wall/edit/{id}(id=${post.id})}" method="post" class="stack-form">
                <textarea name="content" class="form-textarea" rows="4" required th:text="${post.content}"></textarea>
                <div class="button-row mt-sm">
                    <button type="submit" class="btn-primary btn-sm">Зберегти</button>
                    <button type="button" class="btn-outline btn-sm" th:data-id="${post.id}" onclick="togglePublicPostEdit(this.getAttribute('data-id'))">Скасувати</button>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
