<div th:fragment="articles-list(articles, title, basePath, allowEdit, allowDelete)">
    <div class="section-header">
        <h2 class="section-title" th:text="${title}">Мої статті</h2>
        <a th:if="${allowEdit}" th:href="@{${basePath} + '/create'}" class="btn-primary">Створити нову статтю</a>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Заголовок</th>
            <th>Категорія</th>
            <th th:if="${allowEdit or allowDelete}" class="actions-column">Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="article : ${articles}" class="clickable-row" th:data-article-id="${article.id}">
            <td>
                <span th:text="${article.title}">Назва</span>
            </td>
            <td>
                <span th:if="${article.categoryTranslation != null}" th:text="${article.categoryTranslation.displayName}">Категорія</span>
                <span th:unless="${article.categoryTranslation != null}" th:text="${article.category}">Категорія</span>
            </td>
            <td th:if="${allowEdit or allowDelete}" class="action-group">
                <!-- Кнопка "Редагувати" з'явиться ТІЛЬКИ якщо email авторизованого користувача збігається з email автора статті -->
<!--                <a th:if="${allowEdit}" th:href="@{${basePath} + '/edit/' + ${article.id}}" class="btn-outline">Редагувати</a>-->

                <a th:if="${allowEdit and article.author != null and currentUserEmail == article.author.email}"
                   th:href="@{${basePath} + '/edit/' + ${article.id}}"
                   class="btn-outline">Редагувати</a>

                <!-- Кнопка "Видалити" доступна завжди (бо цей фрагмент викликається або в адмінці для модерації, або в кабінеті фахівця для його власних статей) -->
                <form th:action="@{${basePath} + '/delete/' + ${article.id}}" method="post" class="form-inline-reset">
                    <button type="submit" class="btn-primary">Видалити</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(articles)}">
            <td th:colspan="${allowEdit or allowDelete ? 3 : 2}" class="text-muted center">Список статей порожній.</td>
        </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Windsurf: Обробка кліку на рядок таблиці для переходу до статті
            const clickableRows = document.querySelectorAll('.clickable-row');
            clickableRows.forEach(function(row) {
                row.addEventListener('click', function() {
                    const articleId = this.getAttribute('data-article-id');
                    if (articleId) {
                        window.location.href = '/articles/' + articleId;
                    }
                });
            });
        });
    </script>
</div>
