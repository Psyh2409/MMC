<div th:fragment="commentNode(comment, depth)" class="comment-card-nested" th:id="'comment-' + ${comment.id}">
    <div class="comment-header">

        <div class="avatar-circle avatar-xs">
            <img th:if="${comment.author != null and comment.author.avatarFileName != null}"
                 th:src="@{/api/media/{name}(name=${comment.author.avatarFileName})}"
                 alt="Avatar">

            <span th:unless="${comment.author != null and comment.author.avatarFileName != null}"
                  th:text="${comment.author != null ? #strings.substring(comment.author.name, 0, 1).toUpperCase() : '❓'}">А</span>
        </div>

        <div class="comment-meta">
            <strong th:text="${comment.author != null ? (comment.author.name ?: comment.author.email) : 'Анонім'}">Автор</strong>
            <span class="text-muted" th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
        </div>
    </div>

    <!-- Текст коментаря -->
    <!-- Вміст коментаря -->
    <div class="comment-text">
        <p th:if="${comment.deletedByAdmin}" class="text-muted font-italic mb-0">
            🚫 Коментар видалено адміністратором
        </p>
        <p th:if="${comment.deletedByAuthor and !comment.deletedByAdmin}" class="text-muted font-italic mb-0">
            🚫 Коментар видалено автором статті
        </p>
        <p th:if="${comment.deletedByCommenter and !comment.deletedByAdmin and !comment.deletedByAuthor}" class="text-muted font-italic mb-0">
            🚫 Коментар видалено коментатором
        </p>

        <p th:if="${!comment.deletedByAdmin and !comment.deletedByAuthor and !comment.deletedByCommenter}"
           th:text="${comment.content}"
           class="mb-0">
            Текст коментаря
        </p>
    </div>

    <!-- Блок дій (видимий тільки якщо не видалено жодною з трьох ролей) -->
    <div th:if="${!comment.deletedByAdmin and !comment.deletedByAuthor and !comment.deletedByCommenter}" class="comment-actions">

        <!-- Відповісти (з точним URL для JS) -->
        <button th:if="${#authorization.expression('isAuthenticated()')}"
                type="button"
                class="btn-outline btn-sm btn-reply-action"
                th:data-id="${comment.id}"
                th:data-url="${comment.article != null ? '/articles/' + comment.article.id + '/comments' : (comment.publicPost != null ? '/public-posts/' + comment.publicPost.id + '/comments' : '')}">
            Відповісти
        </button>

        <!-- Редагувати (Тільки коментатор) -->
        <button th:if="${#authorization.expression('isAuthenticated()') and comment.author != null and comment.author.email == #authentication.name}"
                type="button"
                class="btn-outline btn-sm btn-edit-action"
                th:data-id="${comment.id}">
            Редагувати
        </button>

        <!-- Поскаржитися (Тільки для не-адмінів на чужі коментарі) -->
        <button th:if="${#authorization.expression('isAuthenticated()') and !#authorization.expression('hasRole(''ADMIN'')') and comment.author != null and comment.author.email != #authentication.name}"
                type="button"
                class="btn-outline btn-sm btn-report-action"
                th:data-id="${comment.id}"
                data-type="COMMENT">
            Поскаржитися
        </button>

        <!-- Видалення власними руками (Commenter -> пряме видалення без модалки) -->
        <form th:if="${#authorization.expression('isAuthenticated()') and comment.author != null and comment.author.email == #authentication.name}"
              th:action="@{/articles/comments/{id}/delete(id=${comment.id})}"
              method="post"
              class="d-inline"
              onsubmit="return confirm('Видалити свій коментар?');">
            <button type="submit" class="btn-outline btn-sm">Видалити</button>
        </form>

        <!-- Модерація чужого коментаря (Автор статті/поста або Адмін) -->
        <button th:if="${#authorization.expression('isAuthenticated()') and (comment.author == null or comment.author.email != #authentication.name) and (
                (comment.article != null and comment.article.author != null and comment.article.author.email == #authentication.name) or
                (comment.publicPost != null and comment.publicPost.author != null and comment.publicPost.author.email == #authentication.name) or
                #authorization.expression('hasRole(''ADMIN'')')
            )}"
                type="button"
                class="btn-outline btn-sm btn-delete-comment-action"
                th:data-id="${comment.id}">
            Модерувати (Видалити)
        </button>
    </div>

    <div th:if="${comment.replies != null and !comment.replies.isEmpty()}" class="replies-container">
        <div th:each="reply : ${comment.replies}">
            <div th:replace="~{fragments/comment-tree :: commentNode(${reply}, ${depth + 1})}"></div>
        </div>
    </div>

</div>
</div>
