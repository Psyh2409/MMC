<div th:fragment="wallForm(isEdit, postId, content, roomId, post)"
     th:class="${isEdit} ? 'wall-edit-container' : 'card-primary mb-md'" xmlns:th="http://www.w3.org/1999/xhtml">

    <form th:id="${isEdit} ? 'wallEditForm-' + ${postId} : 'wallForm'"
          th:data-room="${roomId}"
          action="#"
          method="POST" class="stack-form" enctype="multipart/form-data">

        <div class="form-field">
            <textarea th:id="${isEdit} ? null : 'wallContent'"
                      name="content"
                      rows="4"
                      class="form-input"
                      th:placeholder="${isEdit} ? 'Редагуйте повідомлення...' : 'Напишіть повідомлення на спільній стіні...'"
                      th:text="${content != null and content != '[MEDIA_ONLY]' ? content : ''}"></textarea>
        </div>

        <div class="media-preview-area">
            <div th:if="${isEdit and post != null and post.mediaFileName != null}" class="current-media-display">
                <div th:if="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}">
                    <video controls preload="metadata" class="media-preview">
                        <source th:src="@{/api/room/{roomId}/wall/media/{name}(roomId=${roomId}, name=${post.mediaFileName})}"
                                type="video/mp4">
                    </video>
                </div>
                <div th:unless="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}">
                    <img th:src="@{/api/room/{roomId}/wall/media/{name}(roomId=${roomId}, name=${post.mediaFileName})}"
                         alt="Media" class="media-preview">
                </div>
                <span class="text-sm text-muted current-media-label">
                    📎 Файл у базі: <strong th:text="${post.mediaFileName}"></strong>
                </span>
            </div>

            <div class="edit-media-preview"></div>
            <span th:id="${isEdit} ? null : 'wallFileNameDisplay'" class="text-sm text-muted file-name-display"></span>
        </div>

        <div class="button-row">
            <div class="left-actions">
                <label th:for="${isEdit} ? 'wallMedia-' + ${postId} : 'wallMedia'" class="btn-outline">📎
                    Медіафайл</label>
                <input type="file" th:id="${isEdit} ? 'wallMedia-' + ${postId} : 'wallMedia'" name="media"
                       accept="image/*,video/*" class="visually-hidden-input wall-media-input">
            </div>

            <div class="right-actions form-actions">
                <button type="submit" th:id="${isEdit} ? null : 'btnSubmitWallForm'" class="btn-primary"
                        th:classappend="${!isEdit} ? 'hidden' : ''" th:text="${isEdit} ? 'Зберегти' : 'Опублікувати'">
                    Опублікувати
                </button>
                <button th:if="${!isEdit}" type="button" id="btnResetWallForm" class="btn-outline hidden">Скасувати
                </button>
                <button th:if="${isEdit}" type="button" class="btn-outline" onclick="window.cancelEditWallPost(this)">
                    Скасувати
                </button>
            </div>
        </div>
    </form>
</div>
<div th:fragment="wallFeed" id="wallFeed" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="card-primary mb-md">
        <form id="wallForm" th:action="@{/api/room/{id}/wall/add(id=${roomId})}" method="POST" class="stack-form" enctype="multipart/form-data">
            <div class="form-field">
                <textarea id="wallContent" name="content" rows="4" class="form-input" placeholder="Напишіть повідомлення на спільній стіні..."></textarea>
            </div>
            <div class="button-row">
                <div class="left-actions">
                    <label for="wallMedia" class="btn-outline">📎 Медіафайл</label>
                    <input type="file" id="wallMedia" name="media" accept="image/*,video/*" class="visually-hidden-input wall-media-input">
                    <span id="wallFileNameDisplay" class="file-name-display text-sm text-muted ml-sm"></span>
                </div>
                <div class="right-actions form-actions">
                    <button type="submit" id="btnSubmitWallForm" class="btn-primary hidden">Опублікувати</button>
                    <button type="button" id="btnResetWallForm" class="btn-outline hidden">Скасувати</button>
                </div>
            </div>
            <div class="edit-media-preview mt-sm"></div>
        </form>
    </div>

    <div class="journal-feed-list">
        <div th:if="${posts == null or posts.empty}" class="empty-state text-center mt-lg">
            <p class="text-muted">Спільна стіна порожня. Почніть спілкування першими.</p>
        </div>

        <div th:each="post : ${posts}" class="journal-post-card card-secondary mb-sm relative">

            <div class="post-header text-sm text-muted mb-xs">
                <span th:text="${currentUser != null and post.authorId.equals(currentUser.id) ? 'Ви' : post.authorName}">Автор</span>
                <span class="text-muted">•</span>
                <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
            </div>

            <!-- 🟢 ПОВЕРНУТІ SVG ТА ВИПРАВЛЕНЕ ПОРІВНЯННЯ UUID -->
            <div th:if="${currentUser != null and post.authorId != null and post.authorId.equals(currentUser.id)}" class="post-actions absolute top-0 right-0 p-sm action-group">
                <button class="btn-icon" th:data-id="${post.id}" th:data-room="${roomId}" onclick="window.prepareEditWallPost(this.getAttribute('data-id'), this.getAttribute('data-room'), this)" title="Редагувати">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="btn-icon delete-icon" th:data-id="${post.id}" th:data-room="${roomId}" onclick="window.deleteWallPost(this)" title="Видалити">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>

            <div th:if="${post.content != null and post.content != '[MEDIA_ONLY]'}" class="journal-post-content text-body parse-media-links" th:text="${post.content}">Текст</div>

            <div th:if="${post.mediaFileName != null}" class="journal-post-media-box mt-sm">
                <div th:if="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}" class="media-wrapper">
                    <video controls preload="metadata" class="journal-post-video w-100">
                        <source th:src="@{/api/room/{roomId}/wall/media/{name}(roomId=${roomId}, name=${post.mediaFileName})}" type="video/mp4">
                    </video>
                </div>
                <div th:unless="${post.mediaFileName.toLowerCase().matches('.*\.(mp4|webm|ogg)$')}" class="media-wrapper">
                    <img th:src="@{/api/room/{roomId}/wall/media/{name}(roomId=${roomId}, name=${post.mediaFileName})}" alt="Media" class="journal-post-img w-100">
                </div>
            </div>

            <div class="edit-form-container hidden"></div>



            <!-- 🟢 КНОПКА З ЛІЧИЛЬНИКОМ -->
            <div class="comments-section-wrapper mt-sm pt-xs border-top-subtle">
                <div class="row-between">
                    <!-- 🟢 3.1 БЛОК РЕАКЦІЙ ПОСТА СПІЛЬНОЇ СТІНИ (Вставити сюди) -->
                    <div class="post-reactions-container mt-xs mb-xs">
                        <th:block th:replace="~{fragments/reaction-icons :: reactionBar(targetType='ROOM_WALL_POST', targetId=${post.id})}"></th:block>
                    </div>
                    <button type="button" class="btn-primary text-sm" th:data-post-id="${post.id}" th:data-room-id="${roomId}" onclick="window.toggleCommentsBlock(this)">
                        💬 Коментарі (<span th:text="${post.commentsCount}">0</span>)
                    </button>
                </div>
                <div th:id="'comments-container-' + ${post.id}" class="comments-container is-hidden mt-xs"></div>
            </div>

        </div>
    </div>
    <!-- Блок пагінації основної стіни (Попередня / Наступна сторінка постів) -->
    <div th:if="${totalPages > 1}" class="button-row pagination-row mt-md">
        <button th:if="${currentPage > 0}"
                th:data-room="${roomId}"
                th:data-page="${currentPage - 1}"
                th:data-size="5"
                onclick="window.loadWallPage(this)"
                class="btn-outline btn-sm">Попередня</button>

        <span class="text-muted text-sm" th:text="'Сторінка ' + (${currentPage} + 1) + ' з ' + ${totalPages}"></span>

        <button th:if="${hasMore}"
                th:data-room="${roomId}"
                th:data-page="${currentPage + 1}"
                th:data-size="5"
                onclick="window.loadWallPage(this)"
                class="btn-outline btn-sm">Наступна</button>
    </div>
</div>

<!-- 🟢 РЕКУРСИВНИЙ ВУЗОЛ ДЕРЕВА КОМЕНТАРІВ -->
<div th:fragment="commentNode(commentList)" th:remove="tag" xmlns:th="http://www.w3.org/1999/xhtml">
    <div th:each="comment : ${commentList}" class="comment-item mb-sm" th:id="'comment-' + ${comment.id}">

        <!-- Картка коментаря (відступ, якщо це відповідь) -->
        <div class="card-surface p-sm border-radius-sm relative" th:classappend="${comment.parentId != null} ? 'ml-md border-left-primary' : ''">

            <!-- 🟢 ШАПКА КОМЕНТАРЯ: Ліворуч (Автор + Дата), Праворуч (Кнопки дій) -->
            <div class="comment-header row-between w-100 text-xs text-muted mb-xs">

                <!-- Лівий блок: Автор та Дата -->
                <div class="row-center gap-xs">
                    <strong th:text="${comment.isMine ? 'Ви' : comment.authorName}" class="text-main">Автор</strong>
                    <span class="text-muted">•</span>
                    <span th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
                </div>

                <!-- Правий блок: Кнопки дій з ml-auto (виштовхування праворуч) -->
                <div th:if="${comment.isMine}" class="row-center gap-xs action-group ml-auto">
                    <button type="button" class="btn-icon"
                            th:data-comment-id="${comment.id}"
                            onclick="window.toggleEditCommentForm(this)" title="Редагувати">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                    <button type="button" class="btn-icon delete-icon"
                            th:data-comment-id="${comment.id}" th:data-post-id="${postId}" th:data-room-id="${roomId}"
                            onclick="window.deleteComment(this)" title="Видалити">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Текст із класом parse-media-links для лінків -->
            <div class="comment-body text-sm text-body parse-media-links" th:text="${comment.content}"></div>

            <!-- Кнопки керування (красиві, як у статтях) -->
            <div class="comment-actions action-group mt-xs pt-xs row-between">
                <!-- 🟢 3.2 БЛОК РЕАКЦІЙ КОМЕНТАРЯ СПІЛЬНОЇ СТІНИ (Вставити сюди) -->
                <div class="comment-reactions-container mt-xs">
                    <th:block th:replace="~{fragments/reaction-icons :: reactionBar(targetType='ROOM_WALL_COMMENT', targetId=${comment.id})}"></th:block>
                </div>
                <button type="button" class="btn-outline text-xs" th:data-comment-id="${comment.id}" onclick="window.toggleReplyForm(this)">
                    ↳ Відповісти
                </button>
            </div>

            <form th:id="'editCommentForm-' + ${comment.id}" class="edit-comment-form is-hidden mt-sm stack-form" onsubmit="window.submitEditComment(event)">
                <input type="hidden" name="commentId" th:value="${comment.id}">
                <input type="hidden" name="postId" th:value="${postId}">
                <input type="hidden" name="roomId" th:value="${roomId}">
                <div class="form-field">
                    <textarea name="content" rows="2" class="form-input text-sm" required th:text="${comment.content}"></textarea>
                </div>
                <div class="button-row justify-end mt-xs">
                    <button type="button" class="btn-outline btn-sm" th:data-comment-id="${comment.id}" onclick="window.toggleEditCommentForm(this)">Скасувати</button>
                    <button type="submit" class="btn-primary btn-sm ml-xs">Зберегти</button>
                </div>
            </form>
            <!-- Форма відповіді (прихована) -->
            <form th:id="'replyForm-' + ${comment.id}" class="reply-form is-hidden mt-sm stack-form" onsubmit="window.submitComment(event)">
                <input type="hidden" name="postId" th:value="${postId}">
                <input type="hidden" name="roomId" th:value="${roomId}">
                <input type="hidden" name="parentId" th:value="${comment.id}">
                <div class="form-field">
                    <textarea name="content" rows="2" class="form-input text-sm" placeholder="Ваша відповідь..." required></textarea>
                </div>
                <div class="text-right mt-xs">
                    <button type="submit" class="btn-primary btn-sm">Надіслати</button>
                </div>
            </form>
        </div>

        <!-- 🟢 Магія рекурсії: якщо є дочірні коментарі, фрагмент викликає сам себе -->
        <div th:if="${!comment.replies.isEmpty()}" class="replies-container mt-sm">
            <th:block th:replace="~{fragments/shared-wall-form :: commentNode(${comment.replies})}"></th:block>
        </div>
    </div>
</div>

<!-- 🟢 ГОЛОВНИЙ ФРАГМЕНТ КОМЕНТАРІВ (ТЕ ЩО ВСТАВЛЯЄТЬСЯ AJAX-ом) -->
<div th:fragment="commentsFeed" class="comments-feed-box p-sm border-top-muted mt-sm" xmlns:th="http://www.w3.org/1999/xhtml">

    <!-- Невидимий інпут, з якого JS забере нову цифру лічильника -->
    <input type="hidden" id="dynamic-count" th:value="${newCount != null ? newCount : ''}">

    <div class="comments-list">
        <div th:if="${comments == null or comments.empty}" class="text-muted text-xs p-xs center">
            Будьте першим, хто залишить коментар.
        </div>

        <!-- Виклик вузла дерева для кореневих коментарів -->
        <th:block th:if="${comments != null and !comments.empty}">
            <th:block th:replace="~{fragments/shared-wall-form :: commentNode(${comments})}"></th:block>
        </th:block>
    </div>

    <form th:id="'addCommentForm-' + ${postId}" class="mt-sm stack-form" onsubmit="window.submitComment(event)">
        <input type="hidden" name="postId" th:value="${postId}">
        <input type="hidden" name="roomId" th:value="${roomId}">
        <input type="hidden" name="parentId" value=""> <!-- Порожньо для кореня -->
        <div class="form-field">
            <textarea name="content" rows="2" class="form-input text-sm" placeholder="Додати коментар..." required></textarea>
        </div>
        <div class="text-right mt-xs">
            <button type="submit" class="btn-primary btn-sm">Надіслати</button>
        </div>
    </form>
</div>
