<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(title, mainContent, pageScripts)">
<head>
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌿</text></svg>">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script>
        (function() {
            // 1. Читаємо збережені дані
            var savedTheme = localStorage.getItem('app-theme');
            var customHue = localStorage.getItem('custom-hue');
            var customSat = localStorage.getItem('custom-sat');

            // 2. ПЕРЕВІРКА: Якщо даних немає (Гість), вмикаємо Монохромну Класику
            if (!savedTheme) {
                document.documentElement.setAttribute('data-theme', 'custom');
                document.documentElement.style.setProperty('--theme-h', '210');
                document.documentElement.style.setProperty('--theme-s', '5%');
            } else {
                // 3. Якщо це повернувся АВТОР або КЛІЄНТ - відновлюємо їх колір
                document.documentElement.setAttribute('data-theme', savedTheme);
                if (savedTheme === 'custom' && customHue) {
                    document.documentElement.style.setProperty('--theme-h', customHue);
                    document.documentElement.style.setProperty('--theme-s', customSat || '75%');
                }
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Психотерапія | Шлях до себе</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">

    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>
<body class="page-shell">

<div th:replace="~{fragments/header :: header-fragment}"></div>
<!-- Домінуюче критичне сповіщення -->
<div id="criticalAlertModal" class="modal-backdrop is-hidden">
    <div class="modal-card critical-alert-card">
        <header class="modal-header">
            <h3 id="criticalAlertTitle" class="heading-md text-danger">⚠️ Важливе сповіщення</h3>
        </header>
        <div class="modal-body mb-sm">
            <p id="criticalAlertMessage" class="text-main">Текст повідомлення...</p>
        </div>
        <footer class="modal-footer">
            <a id="criticalAlertLink" href="#" class="btn-primary btn-sm is-hidden">Перейти</a>
            <button type="button" id="criticalAlertReadBtn" class="btn-outline btn-sm" onclick="closeCriticalModal()">
                Зрозуміло
            </button>
        </footer>
    </div>
</div>
<main class="page-main">
    <div th:replace="${mainContent}"></div>
</main>

<div id="offline-banner" class="system-offline-banner">
    <div class="card">
        <h2>🛠 Технічна пауза</h2>
        <p>Зв'язок із сервером тимчасово втрачено.</p>
        <p>Це не ви, це інтернет з'єднання нашого серверу. Ми вже очікуємо на відновлення.</p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer-fragment}"></div>

<script th:src="@{/js/theme-switcher.js}"></script>
<script th:src="@{/js/connectivity.js}"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }
</script>
<th:block th:replace="${pageScripts} ?: ~{}"></th:block>
<!-- Універсальне модальне вікно скарг -->
<div th:replace="~{fragments/report-modal :: #reportModal}"></div>
<!-- Модальні вікна -->
<div th:replace="~{fragments/delete-comment-modal :: #deleteCommentModal}"></div>
<!-- Загальні скрипти -->
<script src="/js/report.js" defer></script>
<script src="/js/notifications.js" defer></script>
</body>
</html>
