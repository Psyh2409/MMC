<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: main-layout(
      ~{::title},
      ~{::section},
      ~{::page-scripts}
      )}">
<head>
    <title>Календар сесій | MMC</title>
</head>
<body>

<section class="standard-container standard-container-wide">

    <!-- Шапка з динамічною кнопкою повернення -->
    <header class="section-header mb-md row-between align-center">
        <h1 class="page-title-accent">📅 Календар сесій</h1>

        <div class="action-group">
            <a th:if="${isTherapist}" th:href="@{/therapist/dashboard}" class="btn-outline btn-sm">← До кабінету</a>
            <a th:unless="${isTherapist}" th:href="@{/profile#therapy-tab}" class="btn-outline btn-sm">← До профілю</a>
        </div>
    </header>

    <div class="card-primary">
        <!-- Атрибут data-is-therapist зчитає наш новий JS файл -->
        <div id="calendar-container" th:data-is-therapist="${isTherapist}"></div>
    </div>

    <!-- Модальне вікно рендериться ВИКЛЮЧНО для фахівця -->
    <div th:if="${isTherapist}" id="session-modal" class="modal-overlay">
        <div class="card-primary w-100 modal-content-sm">
            <div class="row-between mb-sm">
                <h3 class="heading-md">Запланувати сесію</h3>
                <button type="button" class="btn-outline btn-sm" onclick="toggleSessionModal()">Закрити</button>
            </div>
            <form id="session-form" class="stack-form">
                <input type="hidden" id="session-id">

                <div class="form-field">
                    <label class="form-input-label">Клієнт</label>
                    <select id="session-client-id" name="clientId" class="form-input" required>
                        <option value="" disabled selected>Оберіть клієнта...</option>
                        <option th:each="assignment : ${activeAssignments}"
                                th:value="${assignment.client.id}"
                                th:text="${assignment.client.name}"></option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-input-label">Дата та час початку</label>
                    <input type="datetime-local" id="session-start" name="startTime" class="form-input" required>
                </div>

                <div class="form-field">
                    <label class="form-input-label">Коментар до сесії (опціонально)</label>
                    <textarea id="session-description" name="description" class="form-input textarea-input" rows="2" placeholder="Наприклад: обговорення результатів тестування..."></textarea>
                </div>

                <div class="form-field">
                    <label class="form-input-label">Повторювати щотижня</label>
                    <select id="session-recurring" name="recurringWeeks" class="form-input">
                        <option value="1" selected>Тільки ця сесія (1 раз)</option>
                        <option value="4">4 тижні (1 місяць)</option>
                        <option value="8">8 тижнів (2 місяці)</option>
                        <option value="12">12 тижнів (3 місяці)</option>
                    </select>
                </div>

                <div class="text-right mt-sm">
                    <button type="button" class="btn-primary" onclick="saveSession()">Зберегти</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Модальне вікно перегляду/скасування сесії -->
    <div th:if="${isTherapist}" id="session-view-modal" class="modal-overlay">
        <div class="card-primary w-100 modal-content-sm">
            <div class="row-between mb-sm">
                <h3 class="heading-md">Деталі сесії</h3>
                <button type="button" class="btn-outline btn-sm" onclick="toggleSessionViewModal()">Закрити</button>
            </div>

            <div class="stack-form">
                <input type="hidden" id="view-session-id">

                <div class="form-field">
                    <strong class="text-main heading-sm" id="view-session-title">Назва події</strong>
                </div>

                <div class="form-field">
                    <span class="text-muted text-sm">📅 Час: </span>
                    <span id="view-session-time" class="text-main">Час</span>
                </div>

                <!-- Блок коментаря (буде приховуватись через клас, якщо коментар відсутній) -->
                <div class="form-field is-hidden" id="view-session-desc-container">
                    <span class="text-muted text-sm d-block mb-xs">📝 Ваша нотатка:</span>
                    <p class="text-sm text-wrap-break p-sm bg-elevated border-radius-xs" id="view-session-desc"></p>
                </div>
                <div class="form-field mt-sm border-top pt-sm">
                    <label class="form-input-label text-error">Причина скасування (необов'язково)</label>
                    <textarea id="cancel-reason" class="form-input textarea-input" rows="2" placeholder="Наприклад: хвороба клієнта..."></textarea>
                </div>
                <div class="action-group mt-xs">
                    <button type="button" class="btn-outline btn-sm text-error" onclick="cancelExistingSession()">🛑 Скасувати сесію</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Підключаємо скрипти -->
<th:block th:fragment="page-scripts">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
    <script th:src="@{/js/calendar.js}" defer></script>
</th:block>

</body>
</html>
