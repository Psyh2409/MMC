<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: main-layout(
      ~{::title},
      ~{::section},
      ~{::page-scripts}
      )}">
<head>
    <title th:text="${therapist.name} + ' | Профіль фахівця'">Профіль фахівця</title>
</head>
<body>

<section class="standard-container standard-container-wide">
    <div class="profile-dashboard mt-md">

        <aside class="profile-sidebar">
            <div class="profile-card card-specialist">
                <div class="card-specialist-avatar">
                    <div class="avatar-circle avatar-lg">
                        <img th:if="${therapist.avatarFileName != null}"
                             th:src="@{/api/media/{name}(name=${therapist.avatarFileName})}"
                             alt="Аватар фахівця">
                        <span th:unless="${therapist.avatarFileName != null}" class="avatar-circle avatar-md"
                              th:text="${therapist.name != null and therapist.name.length() > 0 ? #strings.substring(therapist.name, 0, 1).toUpperCase() : 'U'}">
                        </span>
                    </div>
                </div>

                <h2 class="profile-header-title" th:text="${therapist.name}">Ім'я</h2>
                <div class="badge badge-therapist">ВЕРИФІКОВАНИЙ ФАХІВЕЦЬ</div>

                <div class="issue-callout p-sm card-specialist-info mt-md">
                    <span class="text-muted text-sm">Освітній ступінь:</span>
                    <strong class="d-block" th:text="${therapist.specialistApplication.educationLevel}">Магістр</strong>
                    <br>
                    <span class="text-muted text-sm mt-sm d-block">Спеціальність:</span>
                    <span th:text="${therapist.specialistApplication.specialty != null ? therapist.specialistApplication.specialty : 'Психологія/Психотерапія'}">Спеціальність</span>
                    <br>
                    <span class="text-muted text-sm mt-sm d-block">Фахівець:</span>
                    <span th:text="${therapist.specialistApplication.lastName + ' ' + therapist.specialistApplication.firstName}">ПІБ</span>
                </div>

                <div th:if="${success}" class="status-message status-success mb-md" th:text="${success}"></div>
                <div th:if="${error}" class="status-message status-error mb-md" th:text="${error}"></div>

                <div class="action-group mt-md w-100"
                     th:if="${#authentication.name != therapist.email and canRequestTherapy}">

                    <form th:action="@{/therapist/request-therapy/{id}(id=${therapist.id})}" method="post" class="stack-form w-100">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <!-- Нове поле для опціонального повідомлення з використанням системних токенів -->
                        <div class="form-field mb-sm">
                            <label for="message" class="form-label text-sm text-muted">Повідомлення для фахівця (опціонально):</label>
                            <textarea id="message"
                                      name="message"
                                      class="form-input textarea-input"
                                      rows="3"
                                      placeholder="Коротко опишіть ваш запит або зручний час для первинного контакту..."></textarea>
                        </div>

                        <button type="submit" class="btn-primary w-100">Звернутися за консультацією</button>
                    </form>
                </div>
            </div>
            <div class="card-primary mt-md">
                <h3 class="profile-header-title text-center mb-sm">Написати фахівцю</h3>
                <div th:if="${param.success}" class="status-message status-success mb-sm">
                    ✔ Ваше повідомлення успішно надіслано фахівцю!
                </div>
                <div th:replace="~{fragments/forms :: contact-form(actionUrl=@{/contact/specialist/{id}(id=${therapist.id})})}"></div>
            </div>
        </aside>

        <main class="profile-main-content">
            <div class="profile-card">

                <div class="tabs-navigation mb-md">
                    <button class="tab-button active" onclick="window.switchPublicTab('portfolio-tab', this)">🎓 Портфоліо та методи</button>
                    <button class="tab-button" onclick="window.switchPublicTab('articles-tab', this)">📝 Статті фахівця</button>
                    <button class="tab-button" onclick="window.switchPublicTab('wall-tab', this)">💬 Публічна стіна</button>
                </div>

                <!-- 1. Вкладка Портфоліо (Активна за замовчуванням) -->
                <div id="portfolio-tab" class="tab-pane active">
                    <div th:replace="~{fragments/portfolio-components :: portfolio-view(portfolio=${portfolio})}"></div>
                </div>

                <!-- 2. Вкладка Статті фахівця -->
                <div id="articles-tab" class="tab-pane is-hidden">
                    <div th:if="${#lists.isEmpty(therapistArticles)}" class="profile-empty-state mt-md">
                        <div class="icon">📝</div>
                        <p>Фахівець ще не додав публікацій.</p>
                    </div>

                    <div th:unless="${#lists.isEmpty(therapistArticles)}">
                        <div th:replace="~{fragments/article-components :: articles-list(
                                articles=${therapistArticles},
                                title='Публікації фахівця',
                                basePath='#',
                                allowEdit=false,
                                allowDelete=false
                        )}"></div>
                    </div>
                </div>

                <!-- 3. Вкладка Публічна стіна -->
                <div id="wall-tab" class="tab-pane is-hidden">
                    <h3 class="heading-md mb-sm">Публічна стіна фахівця</h3>

                    <div th:replace="~{fragments/public-wall-components :: wall-feed(posts=${publicPosts}, isOwner=false)}"></div>
                </div>

            </div>
        </main>

    </div>
</section>
<th:block th:fragment="page-scripts">
    <script th:src="@{/js/profile.js}"></script>
    <script th:src="@{/js/media-links.js}"></script>
    <script th:src="@{/js/public-wall.js}"></script>
</th:block>
</body>
</html>
