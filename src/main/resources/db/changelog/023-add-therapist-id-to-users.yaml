databaseChangeLog:
  - changeSet:
      id: 023-add-therapist-id-to-users
      author: mmc
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: therapist_id
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: therapist_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_users_therapist
                    references: users(id)