databaseChangeLog:
  - changeSet:
      id: 022-add-sos-requested-to-users
      author: mmc
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: sos_requested
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: sos_requested
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false